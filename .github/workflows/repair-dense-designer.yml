name: Repair dense editor feature

on:
  push:
    branches:
      - feat/dense-inspector-events-triggers
    paths:
      - .github/workflows/repair-dense-designer.yml
      - .automation/fix_dense_designer_handlers.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-dense-editor-feature
  cancel-in-progress: false

jobs:
  repair:
    name: Apply, verify and commit dense editor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/dense-inspector-events-triggers
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply designer migration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "function addModelEvent" src/components/ModelDesigner.vue; then
            python .automation/apply_dense_designer.py
          fi
          python .automation/fix_dense_designer_handlers.py

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Verify npm package
        run: npm run pack:check

      - name: Commit verified feature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-dense-designer.yml
          rm -f .github/workflows/apply-dense-v2.yml
          rm -f .github/workflows/finalize-dense-feature.yml
          rm -f .github/workflows/repair-dense-designer.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dense fields events and triggers editor"
          git push origin HEAD:feat/dense-inspector-events-triggers
