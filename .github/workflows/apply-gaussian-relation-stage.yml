name: Apply gaussian relation stage

on:
  push:
    branches:
      - feat/gaussian-relation-stage
    paths:
      - .automation/apply_gaussian_relation_stage.py
      - .github/workflows/apply-gaussian-relation-stage.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-gaussian-relation-stage
  cancel-in-progress: true

jobs:
  apply:
    name: Apply, test and commit relation stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/gaussian-relation-stage
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply migration
        run: python .automation/apply_gaussian_relation_stage.py

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Verify npm package
        run: npm run pack:check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-gaussian-relation-stage.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add cinematic gaussian relation layer"
          git push origin HEAD:feat/gaussian-relation-stage
