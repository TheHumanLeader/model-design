name: Apply slimmer identity node

on:
  push:
    branches:
      - fix/slimmer-identity-node
    paths:
      - .automation/apply_slim_identity_node.py
      - .github/workflows/apply-slim-identity-node.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-slimmer-identity-node
  cancel-in-progress: true

jobs:
  apply:
    name: Apply, test and commit slim node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/slimmer-identity-node
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply node refinement
        run: python .automation/apply_slim_identity_node.py

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Build playground
        run: npm run build:playground

      - name: Verify npm package
        run: npm run pack:check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f .github/workflows/apply-slim-identity-node.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reduce identity node height"
          git push origin HEAD:fix/slimmer-identity-node
