name: Finalize dense editor feature

on:
  push:
    branches:
      - feat/dense-inspector-events-triggers
    paths:
      - .github/workflows/finalize-dense-feature.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-dense-editor-feature
  cancel-in-progress: false

jobs:
  finalize:
    name: Verify and publish to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/dense-inspector-events-triggers
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply any pending migrations
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "export function constrainModelMovement" src/core/document.ts; then
            test -f .automation/apply_dense_core.py
            python .automation/apply_dense_core.py
          fi

          if ! grep -q "function addModelEvent" src/components/ModelDesigner.vue; then
            test -f .automation/apply_dense_designer.py
            python .automation/apply_dense_designer.py
          fi

      - name: Remove staging automation
        shell: bash
        run: |
          rm -rf .automation
          rm -f .github/workflows/apply-dense-core.yml
          rm -f .github/workflows/apply-dense-designer.yml
          rm -f .github/workflows/finalize-dense-feature.yml

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Verify npm package
        run: npm run pack:check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: finalize dense fields events and triggers editor"
          fi

      - name: Publish verified feature to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
