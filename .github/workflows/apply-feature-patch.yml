name: Apply model tags and relations feature

on:
  push:
    branches:
      - feat/model-tags-relations
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-model-tags-relations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply staged feature patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/model-tags-relations
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/model-tags-relations.part* > /tmp/model-tags-relations.patch.gz.b64
          echo "f5160ca6b51cdf81fea0a08efea2bbdacec97068b0a25a4df133bef9c8fdf09d  /tmp/model-tags-relations.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/model-tags-relations.patch.gz.b64 | gzip -d > /tmp/model-tags-relations.patch
          echo "22be64389a77498db804bfe984d9ab1ade1924c68896e5ce483f8b51b8c460f1  /tmp/model-tags-relations.patch" | sha256sum -c -
          git apply --check /tmp/model-tags-relations.patch

      - name: Apply feature
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/model-tags-relations.patch
          rm -rf .automation
          rm -f .github/workflows/apply-feature-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add model tags and field relations"
          git push origin HEAD:feat/model-tags-relations
