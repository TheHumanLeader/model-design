name: Apply dense model editor v2

on:
  push:
    branches:
      - feat/dense-inspector-events-triggers
    paths:
      - .github/workflows/apply-dense-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-dense-model-editor-v2
  cancel-in-progress: false

jobs:
  apply:
    name: Apply, verify and commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/dense-inspector-events-triggers
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Reconstruct installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat .automation/dense-v2.part* > /tmp/install_dense_v2.py.gz.b64
          echo "49be4dd4779040e06afd0e61782ef25dd5be69f655ad498dd67e621c6dc2c118  /tmp/install_dense_v2.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/install_dense_v2.py.gz.b64 | gzip -d > scripts/install_dense_v2.py
          echo "4d2ffec529a84b03e1875283eae0241d71bfd633e3febbcab43a6c9ec49f0b11  scripts/install_dense_v2.py" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/install_dense_v2.py')
          source = path.read_text(encoding='utf-8')
          old = '''    "next.models.push(model)\\nconst finalDocument = groupExists\\n  ? ensureGroupContainsMembers(next, groupExists)\\n  : next\\n\\ncommitDocument(finalDocument, '已创建模型')\\n",\n    "next.models.push(model)\\ncommitDocument(next, '已创建模型')\\n",'''
          new = '''    "  next.models.push(model)\\n  const finalDocument = groupExists\\n    ? ensureGroupContainsMembers(next, groupExists)\\n    : next\\n\\n  commitDocument(finalDocument, '已创建模型')\\n",\n    "  next.models.push(model)\\n  commitDocument(next, '已创建模型')\\n",'''
          if source.count(old) != 1:
              raise RuntimeError('Unable to adapt create-model patch to current indentation')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          python3 -m py_compile scripts/install_dense_v2.py

      - name: Apply feature files
        run: python3 scripts/install_dense_v2.py

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Verify npm package
        run: npm run pack:check

      - name: Commit verified feature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          rm -f scripts/install_dense_v2.py
          rmdir scripts 2>/dev/null || true
          rm -f .github/workflows/apply-dense-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add dense model configuration, events and triggers"
          git push origin HEAD:feat/dense-inspector-events-triggers
